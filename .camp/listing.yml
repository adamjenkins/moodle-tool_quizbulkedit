name: tool_quizbulkedit
summary: 'A Moodle admin tool that changes the settings of some or all quizzes in a course in one go, with a preview before anything is saved.'
description: |
  For teachers and managers who need to change the same quiz settings across a
  course. Tick the quizzes, tick a Change box for each setting to change (review
  options, grade to pass in points or as a percentage of each quiz's maximum
  grade, maximum grade, attempts, question behaviour, timing, display and
  completion), then Preview shows each quiz's current and new values before
  Apply changes. Teachers can save named configurations per course, and site
  administrators can publish admin presets that every course can load.
